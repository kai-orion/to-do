    <style>
        #loading {
            background-color: white;
            pointer-events: none;
            user-select: none;
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0px;
            left: 0px;
            z-index: 999;
        }

        #loading * {
            padding: 0;
            margin: 0;
            border: 0;
            line-height: 0 !important;
        }

        #loading>div {
            position: relative;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            top: -64px;
        }

        #loading>div [type="title"] {
            position: relative;
            font-size: 32px !important;
            font-weight: 900 !important;
        }

        #loading>div [type="logo"] {
            position: relative;
            animation: logoLeadIn 0.3s ease-in-out;
        }

        #loading>div [type="progress"] {
            position: fixed;
            bottom: 28px;
        }

        @keyframes logoLeadIn {
            from {
                position: relative;
                bottom: 64px;
                filter: grayscale(100%) blur(4px);

            }

            to {
                position: relative;
                bottom: 0px;
                filter: grayscale(0%) blur(0px);
            }
        }
    </style>
